# This workflow builds and tests the project on every push, and publishes a
# release when a version tag is pushed.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    # Tags are what trigger a release. Without this the release job would never
    # run at all.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Read-only by default; the release job asks for more where it needs it.
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

  release:
    # A release has to have a tag to hang off. Running this on every push to
    # main was the "requires a tag" error: there was no tag for the release to
    # be named after. An ordinary push now just runs the checks above, and
    # pushing a v-prefixed tag is what publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release creates a release, which is a write.
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.5'

    - name: Build the binary
      # "go build ./..." compiles every package but throws the results away --
      # with more than one package it is only a check that things compile. That
      # is why no file ever appeared for the release step to upload. Naming the
      # one main package and an output path is what actually writes a binary.
      #
      # go-sqlite3 is cgo, so this is a native build against the runner's
      # toolchain rather than a cross-compile. Adding macOS or Windows means
      # adding runners for them, not just setting GOOS.
      run: |
        name="whatsnative-${GITHUB_REF_NAME}-linux-amd64"
        CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o "$name" .
        sha256sum "$name" > "$name.sha256"
        echo "ARTIFACT=$name" >> "$GITHUB_ENV"

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.ARTIFACT }}
          ${{ env.ARTIFACT }}.sha256
        generate_release_notes: true
